name: ping
# Keeps a free-hosted site awake: pings it every 2 minutes for ~28 minutes per run.
# GitHub starts scheduled runs only every ~5-25 minutes, so each run covers the gap.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - run: |
          for i in $(seq 1 14); do
            curl -sS -m 60 --retry 2 -o /dev/null -w "%{http_code}\n" https://vpn.hbsim.com/healthz || true
            sleep 115
          done
          exit 0
