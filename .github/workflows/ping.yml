name: ping
# Keeps a free-hosted site awake: every 5 minutes, ping it 3 times, 2 minutes apart.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          for i in 1 2 3; do
            curl -fsS -m 60 --retry 2 -o /dev/null -w "%{http_code}\n" https://vpn.hbsim.com/healthz || true
            [ "$i" -lt 3 ] && sleep 115
          done
